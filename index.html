<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#C1592E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cardápio do Dia">
<title>Cardápio do Dia</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap');

  :root {
    --paper: #F3E7CE;
    --paper-2: #FFFCF5;
    --ink: #2E2013;
    --ink-soft: #7A6A52;
    --rust: #C1592E;
    --rust-dark: #93411F;
    --rust-light: #E8B489;
    --acai: #5B3A70;
    --herb: #5C8049;
    --gold: #B8862E;
    --salad: #3F7D5E;
    --line: #E6D6AE;
    --danger: #A8341F;
    --shadow: 0 2px 10px rgba(93, 58, 20, 0.08);
    --shadow-lg: 0 6px 20px rgba(93, 58, 20, 0.14);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background:
      radial-gradient(circle at 1px 1px, rgba(184, 134, 46, 0.14) 1px, transparent 0) 0 0/22px 22px,
      var(--paper);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    line-height: 1.5;
    padding: 20px 16px 60px;
  }

  .wrap { max-width: 720px; margin: 0 auto; }
  .layout-grid { display: block; }
  @media (min-width: 900px) {
    .wrap { max-width: 1040px; }
    .layout-grid {
      display: grid;
      grid-template-columns: 1fr 440px;
      gap: 24px;
      align-items: start;
    }
    .preview-col {
      position: sticky;
      top: 16px;
    }
  }

  header.app-header {
    text-align: center;
    margin-bottom: 22px;
    padding-top: 6px;
  }
  .app-emblem {
    width: 54px;
    height: 54px;
    margin: 0 auto 10px;
    border-radius: 50%;
    background: linear-gradient(155deg, var(--rust) 0%, var(--rust-dark) 100%);
    box-shadow: var(--shadow-lg);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .app-emblem svg { width: 26px; height: 26px; stroke: #FFF3E4; }
  header.app-header h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 30px;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
    color: var(--rust-dark);
  }
  header.app-header p {
    margin: 0 0 12px;
    color: var(--ink-soft);
    font-size: 14px;
    font-style: italic;
    font-family: 'Fraunces', serif;
  }
  .header-divider {
    color: var(--gold);
    letter-spacing: 4px;
    font-size: 11px;
    opacity: 0.75;
  }

  .card {
    background: var(--paper-2);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
  }

  .date-row {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }
  .date-row input[type="date"] {
    font: inherit;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--paper-2);
    color: var(--ink);
  }
  .weekday-badge {
    font-family: 'Fraunces', serif;
    font-style: italic;
    color: var(--acai);
    font-size: 15px;
  }

  button {
    font: inherit;
    font-weight: 500;
    font-size: 13.5px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--paper-2);
    color: var(--ink);
    padding: 8px 14px;
    cursor: pointer;
    transition: transform 0.08s ease;
  }
  button.primary {
    background: linear-gradient(155deg, var(--rust) 0%, var(--rust-dark) 100%);
    border-color: var(--rust-dark);
    color: #fff;
    box-shadow: var(--shadow);
  }
  button.primary:active { transform: scale(0.97); }
  button:disabled { opacity: 0.5; cursor: default; }
  button.ghost {
    background: transparent;
    border-color: transparent;
    color: var(--ink-soft);
    padding: 4px 6px;
  }

  section.category {
    margin-bottom: 22px;
  }
  section.category h3 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 19px;
    margin: 0 0 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--ink);
  }
  .cat-badge {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    box-shadow: var(--shadow);
  }
  .cat-badge svg {
    width: 16px;
    height: 16px;
    stroke: #fff;
  }

  .tier {
    border: 1px solid var(--line);
    border-left: 4px solid var(--cat-color, var(--rust));
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 10px;
    background: var(--paper-2);
    box-shadow: var(--shadow);
  }
  .tier-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .tier-head .label {
    font-weight: 500;
    font-size: 14.5px;
  }
  .tier-head .label-input {
    font: inherit;
    font-weight: 500;
    font-size: 14.5px;
    padding: 6px 8px;
    border: 1px solid var(--line);
    border-radius: 5px;
    flex: 1;
    min-width: 120px;
    background: var(--paper-2);
    color: var(--ink);
  }
  .tier-head .price {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 13.5px;
    color: var(--ink-soft);
  }
  .tier-head .price input {
    width: 64px;
    font: inherit;
    padding: 4px 6px;
    border: 1px solid var(--line);
    border-radius: 5px;
  }

  .empty-note {
    font-size: 13px;
    color: var(--ink-soft);
    font-style: italic;
    padding: 4px 0;
  }

  .settings-card summary {
    cursor: pointer;
    font-weight: 500;
    font-size: 14px;
    color: var(--ink-soft);
  }
  .settings-row {
    display: flex;
    gap: 10px;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  .settings-row label {
    font-size: 12.5px;
    color: var(--ink-soft);
    display: block;
    margin-bottom: 3px;
  }
  .settings-row input[type="text"] {
    font: inherit;
    padding: 6px 8px;
    border: 1px solid var(--line);
    border-radius: 5px;
    width: 100%;
  }
  .settings-row .field { flex: 1; min-width: 140px; }

  .history-search {
    width: 100%;
    font: inherit;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 6px;
    margin-bottom: 10px;
  }

  .chip-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 10px;
  }
  .chip-row .none {
    font-size: 13px;
    color: var(--ink-soft);
    font-style: italic;
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--paper-2);
    border: 1px solid var(--cat-color, var(--line));
    border-radius: 20px;
    padding: 5px 6px 5px 12px;
    font-size: 13px;
    font-weight: 500;
    box-shadow: var(--shadow);
  }
  .chip button {
    border: none;
    background: transparent;
    padding: 0 4px;
    font-size: 13px;
    line-height: 1;
    color: var(--ink-soft);
  }

  .pote-tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 12px;
  }
  .pote-tab {
    flex: 1;
    padding: 10px 8px;
    text-align: center;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--paper-2);
    cursor: pointer;
    font-size: 13.5px;
    font-weight: 500;
    color: var(--ink-soft);
  }
  .pote-tab.active {
    background: linear-gradient(155deg, var(--rust) 0%, var(--rust-dark) 100%);
    color: #fff;
    border-color: var(--rust-dark);
    box-shadow: var(--shadow);
  }
  .pote-tab-add {
    flex: 0 0 auto;
    width: 38px;
    font-size: 17px;
    color: var(--rust-dark);
    border-color: var(--rust);
  }
  .reset-potes-btn {
    display: block;
    margin: -6px 0 12px;
    font-size: 12px;
    color: var(--ink-soft);
    text-decoration: underline;
  }
  .confirm-danger {
    color: var(--danger) !important;
    text-decoration: none !important;
    font-weight: 600;
  }
  .multi-form-warning {
    font-size: 12.5px;
    color: var(--danger);
    margin-bottom: 8px;
  }
  .pote-menu {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin: -6px 0 12px;
  }
  .pote-menu-item {
    text-align: left;
    font-size: 13.5px;
    color: var(--rust-dark);
    border-color: var(--rust);
  }
  .hide-tier-btn {
    display: block;
    margin: -4px 0 10px;
    font-size: 12.5px;
  }

  .multi-tier {
    border-left-color: var(--gold);
    margin-top: 12px;
  }
  .multi-tier-heading {
    font-weight: 600;
    font-size: 13.5px;
    color: var(--gold);
    margin-bottom: 10px;
  }
  .multi-match-row {
    align-items: flex-start;
    gap: 10px;
  }
  .multi-match-info {
    flex: 1;
    min-width: 0;
  }
  .multi-match-name {
    font-weight: 500;
  }
  .multi-match-sizes {
    font-size: 12.5px;
    color: var(--ink-soft);
    margin-top: 2px;
  }
  .multi-form {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed var(--line);
  }
  .multi-name-input {
    width: 100%;
    font: inherit;
    font-size: 14px;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 6px;
    margin-bottom: 10px;
  }
  .multi-rows {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 8px;
  }
  .multi-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .multi-row-label {
    flex: 1;
    font: inherit;
    font-size: 13.5px;
    padding: 7px 9px;
    border: 1px solid var(--line);
    border-radius: 6px;
  }
  .multi-row-pricewrap {
    display: flex;
    align-items: center;
    gap: 3px;
    font-size: 13.5px;
    color: var(--ink-soft);
    flex-shrink: 0;
  }
  .multi-row-price {
    width: 68px;
    font: inherit;
    font-size: 13.5px;
    padding: 7px 8px;
    border: 1px solid var(--line);
    border-radius: 6px;
  }
  .multi-row-remove {
    flex-shrink: 0;
    padding: 4px 6px;
  }
  .add-size-btn {
    font-size: 12.5px;
    margin-bottom: 10px;
  }
  .multi-form-actions {
    display: flex;
    gap: 8px;
  }

  .search-box {
    position: relative;
    margin-bottom: 8px;
    display: flex;
    gap: 6px;
  }
  .search-box input[type="text"] {
    flex: 1;
    width: auto;
    font: inherit;
    font-size: 14px;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 6px;
  }
  .icon-btn {
    flex-shrink: 0;
    width: 38px;
    height: 38px;
    border-radius: 8px;
    border: 1px solid var(--rust-dark);
    background: linear-gradient(155deg, var(--rust) 0%, var(--rust-dark) 100%);
    color: #fff;
    font-size: 19px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    cursor: pointer;
    box-shadow: var(--shadow);
  }
  .icon-btn:disabled {
    background: var(--paper-2);
    border-color: var(--line);
    color: var(--ink-soft);
    opacity: 0.6;
    cursor: default;
  }
  .match-list {
    border: 1px solid var(--line);
    border-radius: 6px;
    margin-top: 6px;
    overflow: hidden;
  }
  .match-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    font-size: 14px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    background: var(--paper-2);
  }
  .match-row:last-child { border-bottom: none; }
  .match-row:active { background: var(--paper); }
  .match-row.selected { background: #F3E0C8; }
  .match-row .price-tag {
    margin-left: auto;
    font-size: 12px;
    color: var(--ink-soft);
  }
  .add-new-btn {
    width: 100%;
    margin-top: 6px;
    text-align: left;
    color: var(--rust-dark);
    border-color: var(--rust);
  }

  .note-card {
    margin-bottom: 16px;
  }
  .note-label {
    display: block;
    font-size: 13.5px;
    font-weight: 500;
    color: var(--ink-soft);
    margin-bottom: 8px;
  }
  .note-card textarea {
    width: 100%;
    font: inherit;
    font-size: 14px;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 6px;
    resize: vertical;
    background: var(--paper-2);
    color: var(--ink);
  }
  .note-icon-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--paper-2);
    color: var(--rust-dark);
    margin: 0 auto 16px;
    cursor: pointer;
    padding: 0;
  }
  .note-icon-btn svg {
    width: 18px;
    height: 18px;
  }
  .note-hide-btn {
    display: block;
    margin-top: 8px;
    font-size: 12.5px;
  }

  .send-card {
    border: 1px solid var(--herb);
  }
  .send-head {
    margin-bottom: 12px;
  }
  .send-head h2 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 16.5px;
    margin: 0;
    color: var(--herb);
  }

  .poster-scroll-wrap {
    overflow-x: auto;
    margin-bottom: 14px;
    border-radius: 4px;
  }
  .poster {
    background: var(--paper-2);
    border: 1px solid var(--gold);
    outline: 1px solid var(--gold);
    outline-offset: 4px;
    border-radius: 4px;
    padding: 16px 14px;
    width: 400px;
    max-width: 400px;
  }
  .poster-header {
    text-align: center;
    margin-bottom: 10px;
  }
  .poster-emblem {
    width: 32px;
    height: 32px;
    margin: 0 auto 5px;
    border-radius: 50%;
    background: linear-gradient(155deg, var(--rust) 0%, var(--rust-dark) 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #FFF3E4;
  }
  .poster-emblem svg { width: 15px; height: 15px; }
  .poster-title {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 19px;
    color: var(--rust-dark);
    letter-spacing: 0.01em;
  }
  .poster-sub {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 14px;
    color: var(--ink-soft);
    margin-top: 2px;
  }
  .poster-date {
    font-size: 11px;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-top: 3px;
  }
  .poster-rule {
    color: var(--gold);
    font-size: 12px;
    margin-top: 5px;
  }
  .poster-sections {
    display: flex;
    flex-direction: column;
    gap: 9px;
  }
  .poster-category {
    margin-bottom: 9px;
  }
  .poster-cat-header {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--cat-color, var(--rust-dark));
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    padding: 4px 0;
    margin-bottom: 5px;
  }
  .poster-cat-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 15px;
    height: 15px;
    flex-shrink: 0;
  }
  .poster-cat-icon svg {
    width: 13px;
    height: 13px;
    stroke: currentColor;
  }
  .poster-subsection {
    margin-bottom: 5px;
  }
  .poster-subsection:last-child {
    margin-bottom: 0;
  }
  .poster-subhead {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 10px;
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 12px;
    color: var(--ink);
    margin-bottom: 2px;
  }
  .poster-subhead.price-only {
    justify-content: flex-end;
  }
  .poster-subhead .p-price {
    font-family: 'Inter', sans-serif;
    text-transform: none;
    letter-spacing: 0;
    font-weight: 600;
    font-size: 12px;
    color: var(--ink);
    white-space: nowrap;
  }
  .poster-multi-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
    font-size: 12px;
    color: var(--ink-soft);
    padding: 1px 0 1px 8px;
  }
  .poster-multi-row .p-price {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 12px;
    color: var(--ink);
    white-space: nowrap;
  }
  .poster-item {
    font-size: 12.5px;
    color: var(--ink);
    padding: 1px 0;
    line-height: 1.3;
  }
  .poster-item::before {
    content: '— ';
    color: var(--cat-color, var(--rust));
  }
  .poster-note {
    margin-top: 8px;
    padding-top: 6px;
    border-top: 1px dashed var(--line);
    font-size: 12px;
    font-style: italic;
    color: var(--ink-soft);
  }
  .poster-footer {
    text-align: center;
    margin-top: 10px;
  }
  .poster-contact-name {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-style: italic;
    font-size: 13px;
    color: var(--rust-dark);
    margin-top: 4px;
  }
  .poster-contact {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 1px;
  }

  .send-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  button.whatsapp {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: linear-gradient(155deg, #5C8049 0%, #446036 100%);
    border-color: #446036;
    color: #fff;
    box-shadow: var(--shadow);
  }
  button.whatsapp svg { width: 15px; height: 15px; }
  button.whatsapp:active { transform: scale(0.97); }
  button.whatsapp:disabled { background: var(--paper-2); color: var(--ink-soft); border-color: var(--line); }
  .text-fallback-btn {
    display: block;
    margin: 8px auto 0;
    font-size: 12px;
    text-decoration: underline;
  }
  .copy-flash {
    font-size: 12.5px;
    color: var(--herb);
    visibility: hidden;
  }
  .copy-flash.show { visibility: visible; }

  footer.foot {
    text-align: center;
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 34px;
    font-style: italic;
    font-family: 'Fraunces', serif;
  }
  footer.foot .header-divider {
    display: block;
    margin-bottom: 10px;
    font-style: normal;
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="app-header">
    <div class="app-emblem">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="8.5"></circle>
        <path d="M9.3 7v3.4"></path>
        <path d="M8.3 7v3.4"></path>
        <path d="M10.3 7v3.4"></path>
        <path d="M9.3 10.4v6.6"></path>
        <path d="M15 7c1 0 1.7.9 1.7 2s-.7 2-1.7 2v6"></path>
      </svg>
    </div>
    <h1>Cardápio do dia</h1>
    <div class="header-divider">• • • • • • • • • • • •</div>
  </header>

  <div class="layout-grid">
    <div class="editor-col">
      <div class="card date-row">
        <label for="menu-date" style="font-size:13.5px;color:var(--ink-soft);">Data do cardápio</label>
        <input type="date" id="menu-date">
        <span class="weekday-badge" id="weekday-label"></span>
      </div>

      <div id="categories"></div>

      <div id="note-container"></div>
    </div>

    <div class="preview-col">
      <div class="card send-card">
        <div class="send-head">

<script>
if (!window.storage) {
  window.storage = {
    async get(key) {
      const raw = localStorage.getItem(key);
      if (raw === null) throw new Error('key not found: ' + key);
      return { key, value: raw, shared: false };
    },
    async set(key, value) {
      localStorage.setItem(key, value);
      return { key, value, shared: false };
    },
    async delete(key) {
      localStorage.removeItem(key);
      return { key, deleted: true, shared: false };
    },
    async list(prefix) {
      const keys = Object.keys(localStorage).filter(k => !prefix || k.startsWith(prefix));
      return { keys, prefix, shared: false };
    }
  };
}

function setupAppIcon() {
  const size = 180;
  const canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');

  const grad = ctx.createLinearGradient(0, 0, size, size);
  grad.addColorStop(0, '#C1592E');
  grad.addColorStop(1, '#93411F');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, size, size);

  const s = size / 24;
  ctx.strokeStyle = '#FFF3E4';
  ctx.lineWidth = size * 0.05;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  ctx.beginPath();
  ctx.arc(12 * s, 12.5 * s, 8.6 * s, 0, Math.PI * 2);
  ctx.stroke();

  [8.4, 9.4, 10.4].forEach(x => {
    ctx.beginPath();
    ctx.moveTo(x * s, 7.7 * s);
    ctx.lineTo(x * s, 11 * s);
    ctx.stroke();
  });
  ctx.beginPath();
  ctx.moveTo(9.4 * s, 11 * s);
  ctx.lineTo(9.4 * s, 17.5 * s);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(15 * s, 7.7 * s);
  ctx.bezierCurveTo(16 * s, 7.7 * s, 16.7 * s, 8.6 * s, 16.7 * s, 9.7 * s);
  ctx.bezierCurveTo(16.7 * s, 10.8 * s, 16 * s, 11.7 * s, 15 * s, 11.7 * s);
  ctx.lineTo(15 * s, 17.5 * s);
  ctx.stroke();

  const dataUrl = canvas.toDataURL('image/png');

  let favicon = document.querySelector('link[rel="icon"]');
  if (!favicon) {
    favicon = document.createElement('link');
    favicon.rel = 'icon';
    document.head.appendChild(favicon);
  }
  favicon.type = 'image/png';
  favicon.href = dataUrl;

  let appleIcon = document.querySelector('link[rel="apple-touch-icon"]');
  if (!appleIcon) {
    appleIcon = document.createElement('link');
    appleIcon.rel = 'apple-touch-icon';
    document.head.appendChild(appleIcon);
  }
  appleIcon.href = dataUrl;
}
setupAppIcon();

const CATEGORY_DEFS = [
  { key: 'refeicao', name: 'Refeições', color: 'var(--rust)', headerStyle: 'block',

      { key: '350', label: 'Pote de 350ml', defaultVisible: true, fixed: true }

const MONTHS_PT = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const WEEKDAYS_PT = ['Domingo','Segunda-Feira','Terça-Feira','Quarta-Feira','Quinta-Feira','Sexta-Feira','Sábado'];

const DEFAULT_DATA = {
  settings: { name: 'Cristina Cardoso', phone: '(91) 98124-9409' },
  tierPrices: { 'refeicao_350': 14, 'salada_padrao': 9, 'sobremesa_padrao': 10, 'suco_padrao': 4, 'refrigerante_padrao': 5 },
  tierVisibility: {},
  tierLabels: {},
  notesByDate: {},
  customPotes: [],
  multiItems: [],
  items: [
    { id: 'i5', category: 'sobremesa', tier: 'padrao', name: 'Musse de Morango' },
    { id: 'i6', category: 'sobremesa', tier: 'padrao', name: 'Musse de Maracujá' },
    { id: 'i7', category: 'suco', tier: 'padrao', name: 'Acerola' },
    { id: 'i8', category: 'suco', tier: 'padrao', name: 'Caju' },
    { id: 'i9', category: 'suco', tier: 'padrao', name: 'Taperebá' },

let state = null;

function todayISO() {
  const d = new Date();
  const off = d.getTimezoneOffset();
  return new Date(d.getTime() - off*60000).toISOString().slice(0,10);
}

function fmtDate(iso) {
  const [y,m,d] = iso.split('-').map(Number);
  return String(d).padStart(2,'0') + '.' + MONTHS_PT[m-1] + '.' + y;
}

function weekdayOf(iso) {
  const [y,m,d] = iso.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  return WEEKDAYS_PT[dt.getDay()];
}

async function loadState() {
  let data = null;
  try {
    const res = await window.storage.get('cardapio-data', false);
    if (res && res.value) data = JSON.parse(res.value);
  } catch (e) { /* not found yet */ }
  if (!data) data = JSON.parse(JSON.stringify(DEFAULT_DATA));

  Object.keys(DEFAULT_DATA.tierPrices).forEach(key => {
    if (!(key in data.tierPrices)) data.tierPrices[key] = DEFAULT_DATA.tierPrices[key];
  });
  if (!data.tierVisibility) data.tierVisibility = {};
  if (!data.tierLabels) data.tierLabels = {};
  if (!data.notesByDate) data.notesByDate = {};
  if (!data.customPotes) data.customPotes = [];
  if (!data.multiItems) data.multiItems = [];

  // migração: versões antigas tinham potes fixos de 250ml e 500ml.
  // Se havia dados usando esses potes, viram potes personalizados agora.
  ['250', '500'].forEach(oldKey => {
    const hasItems = data.items.some(it => it.category === 'refeicao' && it.tier === oldKey);
    const hadLabel = ('refeicao_' + oldKey) in (data.tierLabels || {});
    const hadPrice = ('refeicao_' + oldKey) in (data.tierPrices || {});
    const wasVisible = data.tierVisibility && data.tierVisibility['refeicao_' + oldKey] === true;
    if (!hasItems && !hadLabel && !hadPrice && !wasVisible) return;

    const newKey = 'legacy' + oldKey;
    if (data.customPotes.includes(newKey)) return;

    data.items.forEach(it => {
      if (it.category === 'refeicao' && it.tier === oldKey) it.tier = newKey;
    });
    if (data.tierPrices['refeicao_' + oldKey] !== undefined) {
      data.tierPrices['refeicao_' + newKey] = data.tierPrices['refeicao_' + oldKey];
    }
    const migratedLabel = data.tierLabels['refeicao_' + oldKey];
    data.tierLabels['refeicao_' + newKey] = migratedLabel || (oldKey === '250' ? 'Pote de 250ml' : 'Pote de 500ml');
    data.customPotes.push(newKey);
  });

  return data;
}

async function saveState() {
  try {
    await window.storage.set('cardapio-data', JSON.stringify(state), false);
  } catch (e) {
    console.error('Falha ao salvar', e);
  }
}

function genId() {
  return 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
}

function getSelectedIds(dateIso) {
  return new Set(state.selectionByDate[dateIso] || []);
}

function setSelected(dateIso, id, on) {
  const set = getSelectedIds(dateIso);
  if (on) set.add(id); else set.delete(id);
  state.selectionByDate[dateIso] = Array.from(set);
}

function itemsFor(catKey, tierKey) {
  return state.items.filter(it => it.category === catKey && it.tier === tierKey);
}

function priceOf(catKey, tierKey) {
  return state.tierPrices[catKey + '_' + tierKey] || 0;
}

function priceDisplay(catKey, tierKey) {
  const v = state.tierPrices[catKey + '_' + tierKey];
  return (v === undefined || v === null) ? '' : v.toFixed(2);
}

function isTierVisible(cat, tier) {
  const key = cat.key + '_' + tier.key;
  if (key in state.tierVisibility) return state.tierVisibility[key];
  return tier.defaultVisible !== false;
}

function setTierVisible(cat, tier, val) {
  state.tierVisibility[cat.key + '_' + tier.key] = val;
}

function labelOf(cat, tier) {
  const key = cat.key + '_' + tier.key;
  if (key in state.tierLabels) return state.tierLabels[key];
  return tier.defaultVisible ? tier.label : '';
}

function setLabel(cat, tier, val) {
  state.tierLabels[cat.key + '_' + tier.key] = val;
}

function currentDate() {
  return document.getElementById('menu-date').value || todayISO();
}

const searchState = {};

let activePote = null;
let poteMenuOpen = false;

function getRefeicaoTiers(cat) {
  const fixed = cat.tiers.find(t => t.fixed);
  const customs = state.customPotes.map(id => ({ key: id, label: '', defaultVisible: true, fixed: false }));
  return [fixed, ...customs];
}

function tiersForCategory(cat) {
  return cat.key === 'refeicao' ? getRefeicaoTiers(cat) : cat.tiers;
}

function extractSizeNumber(label) {
  const m = (label || '').match(/(\d+(?:[.,]\d+)?)/);
  return m ? parseFloat(m[1].replace(',', '.')) : -Infinity;
}

function sortedSizes(sizes) {
  return sizes.slice().sort((a, b) => extractSizeNumber(b.label) - extractSizeNumber(a.label));
}

function addCustomPote(cat) {
  const id = 'c' + genId();
  state.customPotes.push(id);
  activePote = id;
  saveState();
  render();
}

function removeCustomPote(cat, tier) {
  state.customPotes = state.customPotes.filter(id => id !== tier.key);
  delete state.tierLabels[cat.key + '_' + tier.key];
  delete state.tierPrices[cat.key + '_' + tier.key];
  activePote = null;
  saveState();
  render();
}

function renderRefeicaoCategory(section, cat, dateIso, selected) {
  const tiers = getRefeicaoTiers(cat);

  if (!activePote || !tiers.some(t => t.key === activePote)) {
    activePote = tiers[0].key;
  }

  const tabs = document.createElement('div');
  tabs.className = 'pote-tabs';
  tiers.forEach(t => {
    const tab = document.createElement('div');
    tab.className = 'pote-tab' + (t.key === activePote ? ' active' : '');
    tab.textContent = t.fixed ? t.label : (labelOf(cat, t) || 'Pote novo');
    tab.addEventListener('click', () => {
      activePote = t.key;
      render();
    });
    tabs.appendChild(tab);
  });

  const plusTab = document.createElement('div');
  plusTab.className = 'pote-tab pote-tab-add';
  plusTab.textContent = '+';
  plusTab.title = 'Adicionar outro pote';
  plusTab.addEventListener('click', () => addCustomPote(cat));
  tabs.appendChild(plusTab);

  section.appendChild(tabs);

  if (state.customPotes.length > 0) {
    const resetBtn = document.createElement('button');
    resetBtn.className = 'ghost reset-potes-btn';
    resetBtn.type = 'button';
    resetBtn.textContent = 'Redefinir potes extras';
    let resetConfirming = false;
    let resetTimer = null;
    resetBtn.addEventListener('click', () => {
      if (!resetConfirming) {
        resetConfirming = true;
        resetBtn.textContent = 'Toque de novo para confirmar';
        resetBtn.classList.add('confirm-danger');
        resetTimer = setTimeout(() => {
          resetConfirming = false;
          resetBtn.textContent = 'Redefinir potes extras';
          resetBtn.classList.remove('confirm-danger');
        }, 3000);
        return;
      }
      clearTimeout(resetTimer);
      state.customPotes.forEach(id => {
        delete state.tierLabels[cat.key + '_' + id];
        delete state.tierPrices[cat.key + '_' + id];
      });
      state.customPotes = [];
      activePote = null;
      saveState();
      render();
    });
    section.appendChild(resetBtn);
  }

  const tier = tiers.find(t => t.key === activePote);

  const tierBox = document.createElement('div');
  tierBox.className = 'tier';

  const head = document.createElement('div');
  head.className = 'tier-head';

  let label;
  if (tier.fixed) {
    label = document.createElement('div');
    label.className = 'label';
    label.textContent = tier.label;
  } else {
    label = document.createElement('input');
    label.type = 'text';
    label.className = 'label-input';
    label.placeholder = 'Nome do pote';
    label.value = labelOf(cat, tier);
    label.addEventListener('change', () => {
      setLabel(cat, tier, label.value.trim());
      saveState();
      render();
    });
  }

  const priceWrap = document.createElement('div');
  priceWrap.className = 'price';
  priceWrap.innerHTML = 'R$ <input type="text" inputmode="decimal" placeholder="0.00" value="' + priceDisplay(cat.key, tier.key) + '">';
  const priceInput = priceWrap.querySelector('input');
  priceInput.addEventListener('change', () => {
    const raw = priceInput.value.trim();
    if (raw === '') {
      delete state.tierPrices[cat.key + '_' + tier.key];
    } else {
      const v = parseFloat(raw.replace(',', '.'));
      state.tierPrices[cat.key + '_' + tier.key] = isNaN(v) ? 0 : v;
    }
    saveState();
  });
  head.appendChild(label);
  head.appendChild(priceWrap);
  tierBox.appendChild(head);

  if (!tier.fixed) {
    const removeBtn = document.createElement('button');
    removeBtn.className = 'ghost hide-tier-btn';
    removeBtn.textContent = 'Remover este pote';
    let removeConfirming = false;
    let removeTimer = null;
    removeBtn.addEventListener('click', () => {
      if (!removeConfirming) {
        removeConfirming = true;
        removeBtn.textContent = 'Toque de novo para confirmar';
        removeBtn.classList.add('confirm-danger');
        removeTimer = setTimeout(() => {
          removeConfirming = false;
          removeBtn.textContent = 'Remover este pote';
          removeBtn.classList.remove('confirm-danger');
        }, 3000);
        return;
      }
      clearTimeout(removeTimer);
      removeCustomPote(cat, tier);
    });
    tierBox.appendChild(removeBtn);
  }

  renderFilterTierBody(tierBox, cat, tier, dateIso, selected);

  section.appendChild(tierBox);

  renderMultiDishSection(section, cat, dateIso, selected);
}

let multiFormOpen = false;

function renderMultiDishSection(section, cat, dateIso, selected) {
  const wrap = document.createElement('div');
  wrap.className = 'tier multi-tier';

  const heading = document.createElement('div');
  heading.className = 'multi-tier-heading';
  heading.textContent = 'Prato com mais de um tamanho';
  wrap.appendChild(heading);

  const own = state.multiItems.filter(m => m.category === cat.key);
  const chosen = own.filter(m => selected.has(m.id));

  const chipRow = document.createElement('div');
  chipRow.className = 'chip-row';
  if (chosen.length === 0) {
    const none = document.createElement('span');
    none.className = 'none';
    none.textContent = 'Nenhum prato assim escolhido para hoje ainda.';
    chipRow.appendChild(none);
  } else {
    chosen.forEach(m => {
      const chip = document.createElement('span');
      chip.className = 'chip';
      const label = document.createElement('span');
      label.textContent = m.name;
      const rm = document.createElement('button');
      rm.textContent = '✕';
      rm.title = 'Tirar do cardápio de hoje';
      rm.addEventListener('click', () => {
        setSelected(dateIso, m.id, false);
        saveState();
        render();
      });
      chip.appendChild(label);
      chip.appendChild(rm);
      chipRow.appendChild(chip);
    });
  }
  wrap.appendChild(chipRow);

  const searchBox = document.createElement('div');
  searchBox.className = 'search-box';
  const input = document.createElement('input');
  input.type = 'text';
  input.placeholder = 'Buscar prato com mais de um tamanho';
  const addIconBtn = document.createElement('button');
  addIconBtn.className = 'icon-btn';
  addIconBtn.type = 'button';
  addIconBtn.title = 'Cadastrar novo prato com mais de um tamanho';
  addIconBtn.textContent = '+';
  searchBox.appendChild(input);
  searchBox.appendChild(addIconBtn);
  wrap.appendChild(searchBox);

  const matchWrap = document.createElement('div');
  wrap.appendChild(matchWrap);

  function renderMatches() {
    const q = input.value.trim().toLowerCase();
    matchWrap.innerHTML = '';
    if (!q) return;
    const matches = own.filter(m => m.name.toLowerCase().includes(q));
    if (matches.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty-note';
      empty.textContent = 'Nenhum prato registrado com esse nome ainda. Toque em + para cadastrar.';
      matchWrap.appendChild(empty);
      return;
    }
    const list = document.createElement('div');
    list.className = 'match-list';
    matches.slice(0, 8).forEach(m => {
      const isSel = selected.has(m.id);
      const row = document.createElement('div');
      row.className = 'match-row multi-match-row' + (isSel ? ' selected' : '');
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = isSel;
      const info = document.createElement('div');
      info.className = 'multi-match-info';
      const nameSpan = document.createElement('div');
      nameSpan.className = 'multi-match-name';
      nameSpan.textContent = m.name;
      const sizesSpan = document.createElement('div');
      sizesSpan.className = 'multi-match-sizes';
      sizesSpan.textContent = m.sizes.map(s => s.label + ' — R$ ' + s.price.toFixed(2)).join(' · ');
      info.appendChild(nameSpan);
      info.appendChild(sizesSpan);
      const del = document.createElement('button');
      del.className = 'ghost';
      del.textContent = '✕';
      del.title = 'Remover do histórico';
      let delConfirming = false;
      let delTimer = null;
      del.addEventListener('click', (e) => {
        e.stopPropagation();
        if (!delConfirming) {
          delConfirming = true;
          del.textContent = '✓?';
          del.title = 'Toque de novo para confirmar remoção';
          delTimer = setTimeout(() => {
            delConfirming = false;
            del.textContent = '✕';
            del.title = 'Remover do histórico';
          }, 3000);
          return;
        }
        clearTimeout(delTimer);
        state.multiItems = state.multiItems.filter(x => x.id !== m.id);
        Object.keys(state.selectionByDate).forEach(d => {
          state.selectionByDate[d] = state.selectionByDate[d].filter(id => id !== m.id);
        });
        saveState();
        render();
      });
      row.appendChild(cb);
      row.appendChild(info);
      row.appendChild(del);
      row.addEventListener('click', (e) => {
        if (e.target === del) return;
        if (e.target !== cb) cb.checked = !cb.checked;
        setSelected(dateIso, m.id, cb.checked);
        saveState();
        render();
      });
      list.appendChild(row);
    });
    matchWrap.appendChild(list);
  }
  input.addEventListener('input', renderMatches);

  const formBox = document.createElement('div');
  formBox.className = 'multi-form';
  if (!multiFormOpen) formBox.hidden = true;
  wrap.appendChild(formBox);

  function buildForm() {
    formBox.innerHTML = '';
    const nameInput = document.createElement('input');
    nameInput.type = 'text';
    nameInput.className = 'multi-name-input';
    nameInput.placeholder = 'Nome do prato (ex: Vatapá, com arroz)';
    formBox.appendChild(nameInput);

    const rowsWrap = document.createElement('div');
    rowsWrap.className = 'multi-rows';
    formBox.appendChild(rowsWrap);

    function addRow() {
      const row = document.createElement('div');
      row.className = 'multi-row';
      const labelInput = document.createElement('input');
      labelInput.type = 'text';
      labelInput.placeholder = 'Tamanho (ex: Pote de 500ml)';
      labelInput.className = 'multi-row-label';
      const priceWrapEl = document.createElement('span');
      priceWrapEl.className = 'multi-row-pricewrap';
      const priceInput = document.createElement('input');
      priceInput.type = 'text';
      priceInput.inputMode = 'decimal';
      priceInput.placeholder = '0.00';
      priceInput.className = 'multi-row-price';
      priceWrapEl.appendChild(document.createTextNode('R$ '));
      priceWrapEl.appendChild(priceInput);
      const rmBtn = document.createElement('button');
      rmBtn.type = 'button';
      rmBtn.className = 'ghost multi-row-remove';
      rmBtn.textContent = '✕';
      rmBtn.addEventListener('click', () => {
        if (rowsWrap.children.length > 1) row.remove();
      });
      row.appendChild(labelInput);
      row.appendChild(priceWrapEl);
      row.appendChild(rmBtn);
      rowsWrap.appendChild(row);
    }
    addRow();
    addRow();

    const addRowBtn = document.createElement('button');
    addRowBtn.type = 'button';
    addRowBtn.className = 'ghost add-size-btn';
    addRowBtn.textContent = '+ adicionar tamanho';
    addRowBtn.addEventListener('click', addRow);
    formBox.appendChild(addRowBtn);

    const actionsRow = document.createElement('div');
    actionsRow.className = 'multi-form-actions';
    const warningEl = document.createElement('div');
    warningEl.className = 'multi-form-warning';
    warningEl.hidden = true;
    warningEl.textContent = 'Preencha o nome do prato e ao menos um tamanho com preço.';
    const saveBtn = document.createElement('button');
    saveBtn.type = 'button';
    saveBtn.className = 'primary';
    saveBtn.textContent = 'Salvar prato';
    saveBtn.addEventListener('click', () => {
      const name = nameInput.value.trim();
      const sizes = [];
      rowsWrap.querySelectorAll('.multi-row').forEach(r => {
        const l = r.querySelector('.multi-row-label').value.trim();
        const pRaw = r.querySelector('.multi-row-price').value.trim();
        if (!l || !pRaw) return;
        const p = parseFloat(pRaw.replace(',', '.'));
        if (isNaN(p)) return;
        sizes.push({ id: genId(), label: l, price: p });
      });
      if (!name || sizes.length === 0) {
        warningEl.hidden = false;
        return;
      }
      const id = genId();
      state.multiItems.push({ id, category: cat.key, name, sizes });
      setSelected(dateIso, id, true);
      multiFormOpen = false;
      saveState();
      render();
    });
    const cancelBtn = document.createElement('button');
    cancelBtn.type = 'button';
    cancelBtn.className = 'ghost';
    cancelBtn.textContent = 'Cancelar';
    cancelBtn.addEventListener('click', () => {
      multiFormOpen = false;
      render();
    });
    actionsRow.appendChild(saveBtn);
    actionsRow.appendChild(cancelBtn);
    formBox.appendChild(warningEl);
    formBox.appendChild(actionsRow);
  }

  if (multiFormOpen) buildForm();

  addIconBtn.addEventListener('click', () => {
    multiFormOpen = true;
    render();
  });

  section.appendChild(wrap);
}

function renderFilterTierBody(tierBox, cat, tier, dateIso, selected) {
  const stateKey = cat.key + '_' + tier.key;
  if (!(stateKey in searchState)) searchState[stateKey] = '';
  const all = itemsFor(cat.key, tier.key);
  const chosen = all.filter(it => selected.has(it.id));

  const chipRow = document.createElement('div');
  chipRow.className = 'chip-row';
  if (chosen.length === 0) {
    const none = document.createElement('span');
    none.className = 'none';
    none.textContent = 'Nenhum item escolhido para hoje ainda.';
    chipRow.appendChild(none);
  } else {
    chosen.forEach(it => {
      const chip = document.createElement('span');
      chip.className = 'chip';
      const label = document.createElement('span');
      label.textContent = it.name;
      const rm = document.createElement('button');
      rm.textContent = '✕';
      rm.title = 'Tirar do cardápio de hoje';
      rm.addEventListener('click', () => {
        setSelected(dateIso, it.id, false);
        saveState();
        render();
      });
      chip.appendChild(label);
      chip.appendChild(rm);
      chipRow.appendChild(chip);
    });
  }
  tierBox.appendChild(chipRow);

  const searchBox = document.createElement('div');
  searchBox.className = 'search-box';
  const input = document.createElement('input');
  input.type = 'text';
  input.placeholder = 'Buscar item já registrado';
  input.value = searchState[stateKey];
  const addIconBtn = document.createElement('button');
  addIconBtn.className = 'icon-btn';
  addIconBtn.type = 'button';
  addIconBtn.textContent = '+';
  addIconBtn.title = 'Registrar como novo item e incluir hoje';
  searchBox.appendChild(input);
  searchBox.appendChild(addIconBtn);
  tierBox.appendChild(searchBox);

  const matchWrap = document.createElement('div');
  tierBox.appendChild(matchWrap);

  function registerNew() {
    const val = searchState[stateKey].trim();
    if (!val) return;
    const id = genId();
    state.items.push({ id, category: cat.key, tier: tier.key, name: val });
    setSelected(dateIso, id, true);
    searchState[stateKey] = '';
    saveState();
    render();
  }

  function updateIconState() {
    const q = searchState[stateKey].trim().toLowerCase();
    const exact = all.some(it => it.name.toLowerCase() === q);
    addIconBtn.disabled = !q || exact;
  }

  function renderMatches() {
    const q = searchState[stateKey].trim().toLowerCase();
    matchWrap.innerHTML = '';
    updateIconState();
    if (!q) return;

    const matches = all.filter(it => it.name.toLowerCase().includes(q));

    if (matches.length > 0) {
      const list = document.createElement('div');
      list.className = 'match-list';
      matches.slice(0, 8).forEach(it => {
        const isSel = selected.has(it.id);
        const row = document.createElement('div');
        row.className = 'match-row' + (isSel ? ' selected' : '');
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = isSel;
        const nameSpan = document.createElement('span');
        nameSpan.textContent = it.name;
        row.appendChild(cb);
        row.appendChild(nameSpan);
        row.addEventListener('click', (e) => {
          if (e.target !== cb) cb.checked = !cb.checked;
          setSelected(dateIso, it.id, cb.checked);
          saveState();
          render();
        });
        list.appendChild(row);
      });
      matchWrap.appendChild(list);
    } else {
      const empty = document.createElement('div');
      empty.className = 'empty-note';
      empty.textContent = 'Nenhum item registrado com esse nome ainda. Toque em + para registrar.';
      matchWrap.appendChild(empty);
    }
  }

  addIconBtn.addEventListener('click', registerNew);
  input.addEventListener('input', () => {
    searchState[stateKey] = input.value;
    renderMatches();
  });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      const q = searchState[stateKey].trim().toLowerCase();
      const exactMatch = all.find(it => it.name.toLowerCase() === q);
      if (exactMatch) {
        setSelected(dateIso, exactMatch.id, true);
        searchState[stateKey] = '';
        saveState();
        render();
      } else if (q) {
        registerNew();
      }
    }
  });

  renderMatches();
}

  refrigerante: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2h6v3.2l1.5 2.3V21a1 1 0 0 1-1 1h-7a1 1 0 0 1-1-1V7.5L9 5.2V2z"></path><line x1="9" y1="10" x2="15" y2="10"></line></svg>'
};

function render() {
  const dateIso = currentDate();
  document.getElementById('weekday-label').textContent = weekdayOf(dateIso);

  const container = document.getElementById('categories');
  container.innerHTML = '';
  const selected = getSelectedIds(dateIso);

  CATEGORY_DEFS.forEach(cat => {
    const section = document.createElement('section');
    section.className = 'category';
    section.style.setProperty('--cat-color', cat.color);

    const h3 = document.createElement('h3');
    h3.innerHTML = '<span class="cat-badge" style="background:' + cat.color + '">' + CAT_ICONS[cat.key] + '</span>' + cat.name;
    section.appendChild(h3);

    if (cat.key === 'refeicao') {
      renderRefeicaoCategory(section, cat, dateIso, selected);
    } else {
      cat.tiers.forEach(tier => {
        const tierBox = document.createElement('div');
        tierBox.className = 'tier';

        const head = document.createElement('div');
        head.className = 'tier-head';
        const label = document.createElement('div');
        label.className = 'label';
        label.textContent = tier.label;
        const priceWrap = document.createElement('div');
        priceWrap.className = 'price';
        priceWrap.innerHTML = 'R$ <input type="text" inputmode="decimal" value="' + priceOf(cat.key, tier.key).toFixed(2) + '">';
        const priceInput = priceWrap.querySelector('input');
        priceInput.addEventListener('change', () => {
          const v = parseFloat(priceInput.value.replace(',', '.'));
          state.tierPrices[cat.key + '_' + tier.key] = isNaN(v) ? 0 : v;
          saveState();
        });
        head.appendChild(label);
        head.appendChild(priceWrap);
        tierBox.appendChild(head);

        renderFilterTierBody(tierBox, cat, tier, dateIso, selected);

        section.appendChild(tierBox);
      });
    }

    container.appendChild(section);
  });

  renderNote(dateIso);
  refreshPoster();
}

let noteOpen = false;

function renderNote(dateIso) {
  const wrap = document.getElementById('note-container');
  wrap.innerHTML = '';
  const hasNote = !!(state.notesByDate[dateIso] && state.notesByDate[dateIso].trim());

  if (!hasNote && !noteOpen) {
    const btn = document.createElement('button');
    btn.className = 'note-icon-btn';
    btn.title = 'Adicionar nota';
    btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><polyline points="19 12 12 19 5 12"></polyline></svg>';
    btn.addEventListener('click', () => {
      noteOpen = true;
      renderNote(dateIso);
      const field = document.getElementById('note-field');
      if (field) field.focus();
    });
    wrap.appendChild(btn);
    return;
  }

  const card = document.createElement('div');
  card.className = 'card note-card';

  const label = document.createElement('label');
  label.setAttribute('for', 'note-field');
  label.className = 'note-label';
  label.textContent = 'Nota (opcional)';
  card.appendChild(label);

  const textarea = document.createElement('textarea');
  textarea.id = 'note-field';
  textarea.rows = 3;
  textarea.placeholder = 'Alguma observação para o cardápio de hoje...';
  textarea.value = state.notesByDate[dateIso] || '';
  textarea.addEventListener('change', () => {
    const val = textarea.value.trim();
    if (val) {
      state.notesByDate[dateIso] = val;
    } else {
      delete state.notesByDate[dateIso];
    }
    saveState();
  });
  card.appendChild(textarea);

  if (!hasNote) {
    const hideBtn = document.createElement('button');
    hideBtn.className = 'ghost note-hide-btn';
    hideBtn.textContent = 'Ocultar';
    hideBtn.addEventListener('click', () => {
      noteOpen = false;
      renderNote(dateIso);
    });
    card.appendChild(hideBtn);
  }

  wrap.appendChild(card);
}

function refreshPoster() {
  const dateIso = currentDate();
  document.getElementById('poster-date').textContent = fmtDate(dateIso) + ' · ' + weekdayOf(dateIso);
  document.getElementById('poster-contact-name').textContent = state.settings.name;
  document.getElementById('poster-contact').textContent = state.settings.phone;

  const sectionsEl = document.getElementById('poster-sections');
  sectionsEl.innerHTML = '';
  const selected = getSelectedIds(dateIso);

  CATEGORY_DEFS.forEach(cat => {
    const chosenMulti = cat.key === 'refeicao'
      ? state.multiItems.filter(m => m.category === cat.key && selected.has(m.id))
      : [];
    const tiersWithItems = tiersForCategory(cat)
      .map(tier => ({ tier, chosen: itemsFor(cat.key, tier.key).filter(it => selected.has(it.id)) }))
      .filter(x => x.chosen.length > 0);
    if (chosenMulti.length === 0 && tiersWithItems.length === 0) return;

    const catWrap = document.createElement('div');
    catWrap.className = 'poster-category';
    catWrap.style.setProperty('--cat-color', cat.color);

    const catHeader = document.createElement('div');
    catHeader.className = 'poster-cat-header';
    const iconSpan = document.createElement('span');
    iconSpan.className = 'poster-cat-icon';
    iconSpan.innerHTML = CAT_ICONS[cat.key] || '';
    const nameSpan = document.createElement('span');
    nameSpan.textContent = cat.name.toUpperCase();
    catHeader.appendChild(iconSpan);
    catHeader.appendChild(nameSpan);
    catWrap.appendChild(catHeader);

    chosenMulti.forEach(m => {
      const sub = document.createElement('div');
      sub.className = 'poster-subsection';

      const subHead = document.createElement('div');
      subHead.className = 'poster-subhead';
      const subName = document.createElement('span');
      subName.textContent = m.name;
      subHead.appendChild(subName);
      sub.appendChild(subHead);

      sortedSizes(m.sizes).forEach(sz => {
        const row = document.createElement('div');
        row.className = 'poster-multi-row';
        const l = document.createElement('span');
        l.textContent = sz.label;
        const p = document.createElement('span');
        p.className = 'p-price';
        p.textContent = 'R$ ' + sz.price.toFixed(2);
        row.appendChild(l);
        row.appendChild(p);
        sub.appendChild(row);
      });

      catWrap.appendChild(sub);
    });

    const singleTier = chosenMulti.length === 0 && tiersWithItems.length === 1 && tiersForCategory(cat).length === 1;

    tiersWithItems.forEach(({ tier, chosen }) => {
      const label = labelOf(cat, tier) || tier.label;
      const price = priceDisplay(cat.key, tier.key) || '0.00';

      const sub = document.createElement('div');
      sub.className = 'poster-subsection';

      const subHead = document.createElement('div');
      subHead.className = 'poster-subhead';
      if (!singleTier) {
        const subName = document.createElement('span');
        subName.textContent = label;
        subHead.appendChild(subName);
      } else {
        subHead.classList.add('price-only');
      }
      const subPrice = document.createElement('span');
      subPrice.className = 'p-price';
      subPrice.textContent = 'R$ ' + price;
      subHead.appendChild(subPrice);
      sub.appendChild(subHead);

      chosen.forEach(it => {
        const item = document.createElement('div');
        item.className = 'poster-item';
        item.textContent = it.name;
        sub.appendChild(item);
      });

      catWrap.appendChild(sub);
    });

    sectionsEl.appendChild(catWrap);
  });

  const note = (state.notesByDate[dateIso] || '').trim();
  const noteEl = document.getElementById('poster-note');
  if (note) {
    noteEl.textContent = note;
    noteEl.removeAttribute('hidden');
  } else {
    noteEl.setAttribute('hidden', '');
  }

  const any = sectionsEl.children.length > 0;
  document.getElementById('send-whatsapp-btn').disabled = !any;
  document.getElementById('download-img-btn').disabled = !any;
  document.getElementById('copy-msg-btn').disabled = !any;
}

function generateMessage() {
  const dateIso = currentDate();
  const selected = getSelectedIds(dateIso);
  const lines = [];
  lines.push('Cardápio do Dia — ' + fmtDate(dateIso) + ' (' + weekdayOf(dateIso) + ')');
  lines.push('');

  CATEGORY_DEFS.forEach(cat => {
    if (cat.key === 'refeicao') {
      state.multiItems.filter(m => m.category === cat.key && selected.has(m.id)).forEach(m => {
        lines.push(m.name + ':');
        sortedSizes(m.sizes).forEach(sz => lines.push('  ' + sz.label + ' — R$ ' + sz.price.toFixed(2)));
        lines.push('');
      });
    }
    tiersForCategory(cat).forEach(tier => {
      const chosen = itemsFor(cat.key, tier.key).filter(it => selected.has(it.id));
      if (chosen.length === 0) return;
      const label = labelOf(cat, tier) || tier.label;
      const price = priceDisplay(cat.key, tier.key) || '0.00';
      lines.push(label + ' — R$ ' + price);
      chosen.forEach(it => lines.push('• ' + it.name));
      lines.push('');
    });
  });

  const note = (state.notesByDate[dateIso] || '').trim();
  if (note) {
    lines.push('Obs.: ' + note);
    lines.push('');
  }

  lines.push(state.settings.name);
  lines.push(state.settings.phone);

  return lines.join('\n');
}

async function downloadBlob(blob, filename) {
  try {
    if (window.claude && window.claude.use) {
      const downloads = await window.claude.use('downloads');
      if (downloads) {
        await downloads.save({ filename, data: blob });
        return;
      }
    }
  } catch (e) {
    // capacidade indisponível ou recusada — cai para o método padrão do navegador
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function getPosterBlob() {
  const posterEl = document.getElementById('menu-poster');
  const canvas = await html2canvas(posterEl, { scale: 2, backgroundColor: '#FFFCF5' });
  return new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
}

async function shareCardapio() {
  const btn = document.getElementById('send-whatsapp-btn');
  const original = btn.innerHTML;
  btn.disabled = true;
  btn.textContent = 'Gerando imagem...';
  try {
    const blob = await getPosterBlob();
    const file = new File([blob], 'cardapio-' + currentDate() + '.png', { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file], title: 'Cardápio do dia' });
        btn.disabled = false;
        btn.innerHTML = original;
        return;
      } catch (e) {
        // usuário cancelou ou o navegador falhou — cai para o download
      }
    }
    await downloadBlob(blob, file.name);
  } catch (e) {
    console.error('Falha ao gerar imagem', e);
  } finally {
    btn.disabled = false;
    btn.innerHTML = original;
  }
}

async function downloadImage() {
  const btn = document.getElementById('download-img-btn');
  const original = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Gerando...';
  try {
    const blob = await getPosterBlob();
    await downloadBlob(blob, 'cardapio-' + currentDate() + '.png');
  } catch (e) {
    console.error('Falha ao gerar imagem', e);
  } finally {
    btn.disabled = false;
    btn.textContent = original;
  }
}

async function copyMessage() {
  const text = generateMessage();
  const flash = document.getElementById('copy-flash');
  try {
    await navigator.clipboard.writeText(text);
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  }
  flash.classList.add('show');
  setTimeout(() => flash.classList.remove('show'), 1800);
}

async function init() {
  state = await loadState();
  const dateInput = document.getElementById('menu-date');
  dateInput.value = todayISO();
  dateInput.addEventListener('change', render);

  document.getElementById('send-whatsapp-btn').addEventListener('click', shareCardapio);
  document.getElementById('download-img-btn').addEventListener('click', downloadImage);
  document.getElementById('copy-msg-btn').addEventListener('click', copyMessage);

  render();
}

init();
